name: Lab 7–8 on AWS

on:
  push:
    branches: [main]
    paths: ['aws-lab78/**', '.github/workflows/lab78-aws.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to AWS
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and test the container
        run: |
          docker build -t lab78-aws:test aws-lab78/app
          container=$(docker run -d -p 127.0.0.1:18080:8080 lab78-aws:test)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:18080/ | grep -Fx 'Hello world from app! It is Pipeline testing.'
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/no-such-page)
          test "$status" = 404

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: lab78-aws
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      TF_IN_AUTOMATION: 'true'
      STATE_BUCKET: ${{ vars.LAB78_AWS_BUCKET }}
      ECR_REPOSITORY: ${{ vars.LAB78_AWS_REGISTRY }}
      TF_VAR_instance_profile: ${{ vars.LAB78_AWS_PROFILE }}
      TF_VAR_security_group: ${{ vars.LAB78_AWS_HTTP_GROUP }}
      TF_VAR_vpc_id: ${{ vars.LAB78_AWS_VPC }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.LAB78_AWS_ROLE }}
          aws-region: eu-central-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Push Flask image to ECR
        id: image
        run: |
          registry=${ECR_REPOSITORY%%/*}
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker buildx build --platform linux/amd64 --push --tag "$ECR_REPOSITORY:$GITHUB_SHA" --metadata-file image.json aws-lab78/app
          digest=$(jq -er '."containerimage.digest"' image.json)
          echo "uri=$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
      - name: Apply infrastructure plan and verify EC2
        working-directory: aws-lab78/deploy
        env:
          TF_VAR_image: ${{ steps.image.outputs.uri }}
        run: |
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform plan -input=false -out=ec2.tfplan
          terraform apply -input=false ec2.tfplan
          url=$(terraform output -raw service_url)
          curl -fsS --retry 40 --retry-delay 5 --retry-all-errors --max-time 6 "$url/" | grep -Fx 'Hello world from app! It is Pipeline testing.'
          status=$(curl -sS -o /dev/null -w '%{http_code}' "$url/no-such-page")
          test "$status" = 404
          printf '### Flask on Amazon EC2\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
